openapi: 3.0.3
info:
  title: Salon Management API
  description: Authentication and Management API for the Salon System.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:5000
    description: Local Development Server

paths:
  /owner-login:
    post:
      tags:
        - Authentication
      summary: Owner Login
      description: Authenticates a user with the 'owner' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/password or incorrect password
        '403':
          description: Access denied (User is not an Owner)
        '404':
          description: User not found

  /manager-login:
    post:
      tags:
        - Authentication
      summary: Manager Login
      description: Authenticates a user with the 'manager' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/password or incorrect password
        '403':
          description: Access denied (User is not a Manager)
        '404':
          description: User not found

  /staff-login:
    post:
      tags:
        - Authentication
      summary: Staff Login
      description: Authenticates a user with the 'staff' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/password or incorrect password
        '403':
          description: Access denied (User is not a Staff member)
        '404':
          description: User not found

  /customer-login:
    post:
      tags:
        - Authentication
      summary: Customer Login
      description: Authenticates a user with the 'customer' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/password or incorrect password
        '403':
          description: Access denied (User is not a Customer)
        '404':
          description: User not found

  /api/create-manager:
    post:
      summary: Create a new Manager (Owner only)
      tags:
        - Owner
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerCreate'
      responses:
        '200':
          description: Manager created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  username:
                    type: string
        '400':
          description: Invalid input or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal server error (Profile creation failed)

  /api/change-password:
    put:
      summary: Change password for current authenticated user
      tags:
        - User
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error or wrong current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /product:
    get:
      summary: Get all products
      tags:
        - Product
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a product
      tags:
        - Product
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created
  /product/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update a product
      tags:
        - Product
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete a product
      tags:
        - Product
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Product deleted

  /customer:
    get:
      summary: Get all customers
      tags:
        - Customer
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create a customer
      tags:
        - Customer
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created
  /customer/{customer_id}:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update a customer
      tags:
        - Customer
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '200':
          description: Customer updated
    delete:
      summary: Delete a customer
      tags:
        - Customer
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Customer deleted

  /staff:
    get:
      summary: Get all staff
      tags:
        - Staff
      responses:
        '200':
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'
    post:
      summary: Create a staff member
      tags:
        - Staff
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Staff created
  /staff/{staff_id}:
    parameters:
      - name: staff_id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update a staff member
      tags:
        - Staff
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '200':
          description: Staff updated
    delete:
      summary: Delete a staff member
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Staff deleted

  /service:
    get:
      summary: Get all active services
      tags:
        - Service
      responses:
        '200':
          description: List of active services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      summary: Create a service
      tags:
        - Service
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '201':
          description: Service created
  /service/{service_id}:
    parameters:
      - name: service_id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update a service
      tags:
        - Service
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '200':
          description: Service updated
    delete:
      summary: Delete a service
      tags:
        - Service
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Service deleted

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authentication-Token
      description: Token-based authentication required for secured routes.

  schemas:
    Product:
      type: object
      properties:
        product_id: {type: integer}
        product_name: {type: string}
        product_price: {type: number}
        product_min_stock: {type: integer}
        product_curr_stock: {type: integer}
        product_low_stock_alert: {type: boolean}
    ProductCreate:
      type: object
      required: [product_name, product_price, product_min_stock, product_curr_stock]
      properties:
        product_name: {type: string}
        product_price: {type: number}
        product_min_stock: {type: integer}
        product_curr_stock: {type: integer}

    Customer:
      type: object
      properties:
        cust_id: {type: integer}
        cust_name: {type: string}
        cust_ph: {type: string}
        cust_email: {type: string}
        cust_reward_points: {type: integer}
    CustomerCreate:
      type: object
      required: [cust_name, cust_ph, cust_email]
      properties:
        cust_name: {type: string}
        cust_ph: {type: string}
        cust_email: {type: string}

    Staff:
      type: object
      properties:
        staff_id: {type: integer}
        staff_name: {type: string}
        staff_ph: {type: string}
        staff_email: {type: string}
        staff_salary: {type: number}
    StaffCreate:
      type: object
      required: [staff_name, staff_ph, staff_email, staff_salary]
      properties:
        staff_name: {type: string}
        staff_ph: {type: string}
        staff_email: {type: string}
        staff_salary: {type: number}

    Service:
      type: object
      properties:
        service_id: {type: integer}
        service_desc: {type: string}
        to_date: {type: string, format: date}
        active_flg: {type: boolean}
    ServiceCreate:
      type: object
      required: [service_desc, to_date]
      properties:
        service_desc: {type: string}
        to_date: {type: string, format: date}

    ManagerCreate:
      type: object
      required:
        - username
        - password
      properties:
        fullname:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        phone:
          type: string
          example: "1234567890"
        skills:
          type: string
          example: "Hair Styling, Coloring"
        role:
          type: string
          example: "Senior Manager"
        dob:
          type: string
          format: date
          example: "1990-01-01"
        doj:
          type: string
          format: date
          example: "2023-10-25"
        username:
          type: string
          example: "johndoe_mgr"
        password:
          type: string
          format: password
          example: "securePassword123"

    ChangePassword:
      type: object
      required:
        - current_password
        - new_password
        - confirm_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: owner_user
        password:
          type: string
          example: password123
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Authentication token for subsequent requests.
        username:
          type: string
        role:
          type: string
          example: owner