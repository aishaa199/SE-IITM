  # ═══════════════════════════════════════════════════════════════════════════
  # ATTENDANCE
  # ═══════════════════════════════════════════════════════════════════════════

  /api/staff-attendance:
    get:
      tags: [Attendance]
      summary: Get logged-in staff member's attendance records
      description: |
        **User Story:** As a staff member, I want to view my attendance history so that I can verify my punch-in records.
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceRecord' }
    post:
      tags: [Attendance]
      summary: Mark attendance for today
      description: |
        **User Story:** As a staff member, I want to mark my attendance when I arrive so that the manager knows I'm present.
      responses:
        "201":
          description: Attendance marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:           { type: string }
                  register_id:       { type: integer }
                  register_datetime: { type: string, format: date-time }
        "400": { description: Already marked today, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/manager-staff-attendance:
    get:
      tags: [Attendance]
      summary: Get all staff attendance for a given date (manager)
      description: |
        **User Story:** As a salon manager, I want to view staff attendance for any date so that I can monitor punctuality and plan cover.
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
          description: Date to filter (YYYY-MM-DD). Defaults to today.
      responses:
        "200":
          description: Staff attendance for the day
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceRecord' }

  # ═══════════════════════════════════════════════════════════════════════════
  # UTILITIES
  # ═══════════════════════════════════════════════════════════════════════════

  /api/cleanup-appointments:
    delete:
      tags: [Appointments]
      summary: Delete appointment records older than retention period
      description: |
        **User Story:** As a salon manager, I want to purge old appointment records so that the database doesn't grow indefinitely.

        The retention period is defined by the `APPT_HISTORY_RETENTION_DAYS` salon configuration parameter.
      responses:
        "200":
          description: Cleanup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:       { type: string }
                  deleted_count: { type: integer }
        "400": { description: Retention policy not configured, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
