      parameters:
        - name: setting_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Configuration setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalonConfig' }
        "404": { description: Setting not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    put:
      tags: [Salon Config]
      summary: Update a configuration parameter
      description: |
        **User Story:** As a salon manager, I want to change configuration values (e.g. appointment retention period) so that the platform behaves according to business rules.
      parameters:
        - name: setting_id
          in: path
          required: true
