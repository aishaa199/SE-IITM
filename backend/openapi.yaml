openapi: 3.0.3
info:
  title: Salon Management API
  description: Authentication and Management API for the Salon System.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:5000
    description: Local Development Server

paths:
  /owner-login:
    post:
      tags:
        - Authentication
      summary: Owner Login
      description: Authenticates a user with the 'owner' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /manager-login:
    post:
      tags:
        - Authentication
      summary: Manager Login
      description: Authenticates a user with the 'manager' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /staff-login:
    post:
      tags:
        - Authentication
      summary: Staff Login
      description: Authenticates a user with the 'staff' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /customer-login:
    post:
      tags:
        - Authentication
      summary: Customer Login
      description: Authenticates a user with the 'customer' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/change-password:
    put:
      summary: Change password for current authenticated user
      tags:
        - User
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '200':
          description: Password changed successfully

  /api/product:
    get:
      summary: Get all products
      tags:
        - Product
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a product
      tags:
        - Product
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Product created

  /api/product/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get product details
      tags:
        - Product
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      summary: Update a product
      tags:
        - Product
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete a product
      tags:
        - Product
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Product deleted

  /api/inventory-transaction:
    get:
      summary: Get inventory transactions
      tags:
        - Inventory
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryTransaction'
    post:
      summary: Record a transaction
      tags:
        - Inventory
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTransactionCreate'
      responses:
        '201':
          description: Transaction recorded

  /api/order:
    get:
      summary: Get replenishment orders
      tags:
        - Inventory
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of orders
    post:
      summary: Create a replenishment order
      tags:
        - Inventory
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order created

  /api/order/{order_id}:
    parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update order status/replenishment
      tags:
        - Inventory
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Order updated

  /api/customer:
    get:
      summary: Get all customers
      tags:
        - Customer
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create a customer account
      tags:
        - Customer
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '201':
          description: Customer created

  /api/customer/{customer_id}:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get customer profile
      tags:
        - Customer
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Customer details
    put:
      summary: Update customer profile
      tags:
        - Customer
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Customer updated

  /api/customer-summary:
    get:
      summary: Get logged-in customer's dashboard data
      tags:
        - Customer
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSummary'

  /api/staff:
    get:
      summary: Get all staff members
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'

  /api/manager-staff-attendance:
    get:
      summary: Get all staff attendance records for a specific date (Managers only)
      tags:
        - Staff
      security:
        - tokenAuth: []
      parameters:
        - name: date
          in: query
          description: Date in YYYY-MM-DD format. Defaults to today.
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAttendance'
        '400':
          description: Invalid date format
        '404':
          description: No attendance records found

  /api/staff-attendance:
    get:
      summary: Get attendance records for the current month for the logged-in staff
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Attendance list for the current month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAttendance'
    post:
      summary: Mark attendance for the logged-in staff for today
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '201':
          description: Attendance marked successfully
        '400':
          description: Attendance already marked for today

  /api/service:
    get:
      summary: Get all active services
      tags:
        - Service
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'

  /api/appointment:
    get:
      summary: Get manager-level appointment list
      tags:
        - Appointment
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of appointments
    post:
      summary: Book a new appointment
      tags:
        - Appointment
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Appointment booked

  /api/appointment/{appointment_id}:
    parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update appointment (status/time)
      tags:
        - Appointment
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Appointment updated

  /api/invoice:
    get:
      summary: Get all invoices
      tags:
        - Invoice
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
    post:
      summary: Generate a new invoice
      tags:
        - Invoice
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Invoice created

  /api/finance:
    get:
      summary: Get monthly financial reports (Owner/Manager)
      tags:
        - Finance
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Financial records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Finance'
    post:
      summary: Generate financial report for a month
      tags:
        - Finance
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                last_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Finance report generated

  /api/past-months:
    get:
      summary: Get list of months with existing invoices
      tags:
        - Finance
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of available report months

  /api/salon-config:
    get:
      summary: Get all system settings
      tags:        - Configuration
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Configuration list

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authentication-Token

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}

    LoginResponse:
      type: object
      properties:
        token: {type: string}
        username: {type: string}
        role: {type: string}

    ChangePassword:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password: {type: string}
        new_password: {type: string}
        confirm_password: {type: string}

    Product:
      type: object
      properties:
        product_id: {type: integer}
        product_desc: {type: string}
        product_category_name: {type: string}
        product_price: {type: number}
        product_min_qoh: {type: integer}
        product_curr_qoh: {type: integer}
        product_supplier_name: {type: string}
        product_supplier_contact: {type: string}
        product_supplier_email: {type: string}
        product_low_stock_alert: {type: boolean}

    InventoryTransactionCreate:
      type: object
      required: [product_id, quantity, txn_type]
      properties:
        product_id: {type: integer}
        service_id: {type: integer}
        quantity: {type: integer}
        txn_type: {type: integer, description: "0=Usage, 1=Purchase"}

    InventoryTransaction:
      type: object
      properties:
        txn_id: {type: integer}
        product_name: {type: string}
        recorded_by: {type: string}
        service_name: {type: string}
        txn_type: {type: integer}
        quantity: {type: integer}
        date_of_txn: {type: string, format: date-time}

    Order:
      type: object
      properties:
        order_id: {type: integer}
        product_id: {type: integer}
        product_name: {type: string}
        order_quantity: {type: integer}
        order_cost: {type: number}
        order_date: {type: string, format: date-time}
        status: {type: integer, description: "0=Pending, 1=Received"}

    Customer:
      type: object
      properties:
        customer_id: {type: integer}
        customer_name: {type: string}
        customer_contact: {type: string}
        customer_dob: {type: string}
        customer_email: {type: string}
        customer_type: {type: string}
        customer_available_rewards: {type: integer}
        total_spend: {type: number}

    CustomerSummary:
      type: object
      properties:
        customer_type: {type: string}
        upcoming_appointments_count: {type: integer}
        past_appointments_count: {type: integer}
        available_rewards: {type: integer}

    Staff:
      type: object
      properties:
        staff_id: {type: integer}
        staff_name: {type: string}
        staff_email: {type: string}
        staff_cumulative_rating: {type: number}
        is_present_today: {type: boolean}

    StaffAttendance:
      type: object
      properties:
        register_id: {type: integer}
        staff_id: {type: integer}
        register_datetime: {type: string, format: date-time}

    Service:
      type: object
      properties:
        service_id: {type: integer}
        service_desc: {type: string}
        service_price: {type: number}
        service_duration: {type: integer}

    AppointmentCreate:
      type: object
      required: [customer_email, service_ids, appointment_datetime]
      properties:
        customer_email: {type: string}
        staff_id: {type: integer}
        service_ids: {type: array, items: {type: integer}}
        appointment_datetime: {type: string, format: date-time}

    Invoice:
      type: object
      properties:
        invoice_number: {type: integer}
        invoice_date: {type: string}
        customer_name: {type: string}
        service_descs: {type: string}
        rewards_utilized: {type: integer}
        invoice_amount: {type: number}
        status: {type: integer}

    InvoiceCreate:
      type: object
      required: [customer_id, appointment_id, service_ids, invoice_amount]
      properties:
        customer_id: {type: integer}
        appointment_id: {type: integer}
        staff_id: {type: integer}
        service_ids: {type: string}
        invoice_amount: {type: number}
        other_charges: {type: number}

    Finance: 
      type: object
      properties:
        reporting_month: {type: string, format: date-time}
        product_cost: {type: number}
        total_revenue: {type: number}
        staff_salary: {type: number}
        overheads: {type: number}
        other: {type: number}
        net_profit: {type: number}
