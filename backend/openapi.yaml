openapi: 3.0.3
info:
  title: Salon Management API
  description: Authentication and Management API for the Salon System.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:5000
    description: Local Development Server

paths:
  /owner-login:
    post:
      tags:
        - Authentication
      summary: Owner Login
      description: Authenticates a user with the 'owner' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/password or incorrect password
        '403':
          description: Access denied (User is not an Owner)
        '404':
          description: User not found

  /manager-login:
    post:
      tags:
        - Authentication
      summary: Manager Login
      description: Authenticates a user with the 'manager' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/password or incorrect password
        '403':
          description: Access denied (User is not a Manager)
        '404':
          description: User not found

  /staff-login:
    post:
      tags:
        - Authentication
      summary: Staff Login
      description: Authenticates a user with the 'staff' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/password or incorrect password
        '403':
          description: Access denied (User is not a Staff member)
        '404':
          description: User not found

  /customer-login:
    post:
      tags:
        - Authentication
      summary: Customer Login
      description: Authenticates a user with the 'customer' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username/password or incorrect password
        '403':
          description: Access denied (User is not a Customer)
        '404':
          description: User not found

  /api/create-manager:
    post:
      summary: Create a new Manager (Owner only)
      tags:
        - Owner
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerCreate'
      responses:
        '200':
          description: Manager created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  username:
                    type: string
        '400':
          description: Invalid input or user already exists
        '500':
          description: Internal server error (Profile creation failed)

  /api/manager:
    get:
      summary: Get list of all managers (Owner/Manager only)
      tags:
        - Manager
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of managers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Manager'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Owner or Manager access only)

  /api/manager/{manager_id}:
    get:
      summary: Get details of a specific manager
      tags:
        - Manager
      security:
        - tokenAuth: []
      parameters:
        - name: manager_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Manager details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manager'
        '404':
          description: Manager not found
    put:
      summary: Update manager details (Owner or self only)
      tags:
        - Manager
      security:
        - tokenAuth: []
      parameters:
        - name: manager_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manager'
      responses:
        '200':
          description: Manager updated successfully
        '404':
          description: Manager not found
    delete:
      summary: Delete a manager (Owner only)
      tags:
        - Manager
      security:
        - tokenAuth: []
      parameters:
        - name: manager_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Manager deleted successfully
        '404':
          description: Manager not found

  /api/change-password:
    put:
      summary: Change password for current authenticated user
      tags:
        - User
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Validation error or wrong current password

  /api/product:
    get:
      summary: Get all products
      tags:
        - Product
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a product
      tags:
        - Product
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPost'
      responses:
        '201':
          description: Product created
  /api/product/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get product details
      tags:
        - Product
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      summary: Update a product
      tags:
        - Product
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPut'
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete a product
      tags:
        - Product
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Product deleted

  /api/customer:
    get:
      summary: Get all customers
      tags:
        - Customer
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create a customer
      tags:
        - Customer
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created
  /api/customer/{customer_id}:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get customer details
      tags:
        - Customer
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    put:
      summary: Update a customer
      tags:
        - Customer
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Customer updated
    delete:
      summary: Delete a customer
      tags:
        - Customer
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Customer deleted

  /api/staff:
    get:
      summary: Get all staff
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'
    post:
      summary: Create a staff member
      tags:
        - Staff
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Staff member created
  /api/staff/{staff_id}:
    parameters:
      - name: staff_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get staff details
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Staff details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
    put:
      summary: Update a staff member
      tags:
        - Staff
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200':
          description: Staff member updated
    delete:
      summary: Delete a staff member
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Staff member deleted

  /api/service:
    get:
      summary: Get all services
      tags:
        - Service
      security:
        - tokenAuth: []
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      summary: Create a service
      tags:
        - Service
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '201':
          description: Service created
  /api/service/{service_id}:
    parameters:
      - name: service_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get service details
      tags:
        - Service
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
    put:
      summary: Update a service
      tags:
        - Service
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
      responses:
        '200':
          description: Service updated
    delete:
      summary: Delete a service
      tags:
        - Service
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Service deleted

  /api/appointment:
    get:
      summary: Get appointments
      tags:
        - Appointment
      security:
        - tokenAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
    post:
      summary: Create an appointment
      tags:
        - Appointment
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Appointment created
  /api/appointment/{appointment_id}:
    parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get appointment details
      tags:
        - Appointment
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointment_id:
                    type: integer
                  customer_id:
                    type: integer
                  customer_name:
                    type: string
                  staff_id:
                    type: integer
                  staff_name:
                    type: string
                  datetime:
                    type: string
                    format: date-time
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: number
    put:
      summary: Update an appointment
      tags:
        - Appointment
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdate'
      responses:
        '200':
          description: Appointment updated
    delete:
      summary: Delete an appointment
      tags:
        - Appointment
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Appointment deleted

  /api/staff-appointments:
    get:
      summary: Get appointments for the logged-in staff
      tags:
        - Staff
      security:
        - tokenAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of staff appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    appointment_id:
                      type: integer
                    customer_name:
                      type: string
                    datetime:
                      type: string
                      format: date-time
                    services:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string

  /api/staff-attendance:
    get:
      summary: Get staff attendance records (Manager for date/Staff for month)
      tags:
        - Staff
      security:
        - tokenAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: Manager filter by date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAttendance'
    post:
      summary: Mark attendance for current staff member
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '201':
          description: Attendance marked successfully
  /api/staff-attendance/{staff_id}:
    parameters:
      - name: staff_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get specific staff attendance (Internal/Legacy)
      tags:
        - Staff
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Attendance records

  /api/cleanup-appointments:
    delete:
      summary: Cleanup old appointment history (Manager only)
      tags:
        - Manager
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Retention cleanup completed

  /api/inventory-transaction:
    get:
      summary: Get inventory transactions
      tags:
        - Inventory
      security:
        - tokenAuth: []
      parameters:
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of inventory transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryTransaction'
    post:
      summary: Record an inventory transaction
      tags:
        - Inventory
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTransactionCreate'
      responses:
        '201':
          description: Transaction recorded
  /api/inventory-transaction/{txn_id}:
    get:
      summary: Get specific transaction details
      tags:
        - Inventory
      security:
        - tokenAuth: []
      parameters:
        - name: txn_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTransaction'

  /api/salon-config:
    get:
      summary: Get all salon configurations
      tags:
        - Configuration
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Configuration list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalonConfig'
  /api/salon-config/{setting_id}:
    parameters:
      - name: setting_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get specific configuration
      tags:
        - Configuration
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Configuration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonConfig'
    put:
      summary: Update salon configuration
      tags:
        - Configuration
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                param_value:
                  type: string
      responses:
        '200':
          description: Configuration updated

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authentication-Token

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
        role:
          type: string

    ChangePassword:
      type: object
      required:
        - current_password
        - new_password
        - confirm_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string

    ManagerCreate:
      type: object
      required:
        - username
        - password
      properties:
        fullname:
          type: string
        email:
          type: string
        phone:
          type: string
        skills:
          type: string
        role:
          type: string
        dob:
          type: string
          format: date
        doj:
          type: string
          format: date
        branch_name:
          type: string
        username:
          type: string
        password:
          type: string

    Manager:
      type: object
      properties:
        manager_id:
          type: integer
        manager_name:
          type: string
        manager_email:
          type: string
        manager_contact:
          type: string
        manager_skills:
          type: string
        manager_role:
          type: string
        manager_dob:
          type: string
        manager_doj:
          type: string
        branch_name:
          type: string

    Product:
      type: object
      properties:
        product_id:
          type: integer
        product_desc:
          type: string
        product_category_name:
          type: string
        product_price:
          type: number
        product_min_qoh:
          type: integer
        product_curr_qoh:
          type: integer
        product_supplier_name:
          type: string
        product_supplier_contact:
          type: string
        product_supplier_email:
          type: string
        product_low_stock_alert:
          type: boolean

    ProductPost:
      type: object
      required:
        - product_name
      properties:
        product_name:
          type: string
        product_category:
          type: string
        price:
          type: number
        minimum_stock:
          type: integer
        stock_quantity:
          type: integer
        supplier_name:
          type: string
        supplier_contact:
          type: string
        supplier_email:
          type: string

    ProductPut:
      type: object
      properties:
        product_name:
          type: string
        product_category:
          type: string
        price:
          type: number
        minimum_stock:
          type: integer
        stock_quantity:
          type: integer
        supplier_name:
          type: string
        product_supplier_contact:
          type: string
        product_supplier_email:
          type: string

    Customer:
      type: object
      properties:
        customer_id:
          type: integer
        customer_name:
          type: string
        customer_contact:
          type: string
        customer_dob:
          type: string
        customer_reg_date:
          type: string
        customer_email:
          type: string
        customer_address:
          type: string
        number_of_visits:
          type: integer
        customer_type:
          type: string
        customer_preferences:
          type: string
        customer_available_rewards:
          type: integer

    CustomerCreate:
      type: object
      required:
        - customer_name
        - customer_email
      properties:
        customer_name:
          type: string
        customer_contact:
          type: string
        customer_email:
          type: string
        customer_dob:
          type: string
          format: date
        customer_address:
          type: string
        customer_type:
          type: string
        customer_preferences:
          type: string

    CustomerUpdate:
      type: object
      properties:
        customer_name:
          type: string
        customer_contact:
          type: string
        customer_email:
          type: string
        customer_dob:
          type: string
          format: date
        customer_address:
          type: string
        customer_type:
          type: string
        customer_preferences:
          type: string

    Staff:
      type: object
      properties:
        staff_id:
          type: integer
        staff_name:
          type: string
        staff_contact:
          type: string
        staff_email:
          type: string
        staff_skills:
          type: string
        staff_role:
          type: string
        staff_dob:
          type: string
        staff_doj:
          type: string
        staff_salary:
          type: number
        staff_cumulative_rating:
          type: number
        no_of_reviews:
          type: integer

    StaffCreate:
      type: object
      required:
        - username
        - staff_name
      properties:
        username:
          type: string
        staff_name:
          type: string
        staff_contact:
          type: string
        staff_email:
          type: string
        staff_skills:
          type: string
        staff_role:
          type: string
        staff_dob:
          type: string
          format: date
        staff_doj:
          type: string
          format: date
        staff_salary:
          type: number

    StaffUpdate:
      type: object
      properties:
        staff_name:
          type: string
        staff_contact:
          type: string
        staff_email:
          type: string
        staff_skills:
          type: string
        staff_role:
          type: string
        staff_salary:
          type: number
        staff_dob:
          type: string
          format: date
        staff_doj:
          type: string
          format: date

    Service:
      type: object
      properties:
        service_id:
          type: integer
        service_desc:
          type: string
        service_category:
          type: string
        service_price:
          type: number
        service_duration:
          type: integer
        service_products:
          type: string
        active_flg:
          type: boolean
        from_date:
          type: string
        to_date:
          type: string

    ServiceCreate:
      type: object
      required:
        - service_desc
        - service_price
      properties:
        service_desc:
          type: string
        service_category:
          type: string
        service_price:
          type: number
        service_duration:
          type: integer
        service_products:
          type: string
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date

    ServiceUpdate:
      type: object
      properties:
        service_desc:
          type: string
        service_category:
          type: string
        service_price:
          type: number
        service_duration:
          type: integer
        service_products:
          type: string
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date

    Appointment:
      type: object
      properties:
